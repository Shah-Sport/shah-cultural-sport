name: Build, Auto-Unzip & Sign Shah Android Release (.aab & .apk)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign-shah:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: release.keystore
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || vars.STORE_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || vars.ADMOB_APP_ID }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Auto-Detect & Extract Uploaded .zip (Without Overwriting Workflow)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            echo "Searching for uploaded .zip archive in repository..."
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d . -x ".github/*"
              if [ ! -f "settings.gradle.kts" ]; then
                SUB_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
                if [ -n "$SUB_SETTINGS" ]; then
                  SUB_DIR=$(dirname "$SUB_SETTINGS")
                  cp -rn "$SUB_DIR"/. .
                fi
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add --all ':!.github'
              git commit -m "Auto-extract Shah Native Kotlin project files [skip ci]" || true
              git push || true
            else
              echo "::error::Neither settings.gradle.kts nor any .zip file was found in the repository!"
              exit 1
            fi
          fi

      - name: 3. Sanitize Android XML Resources & Lint Config for AAPT2
        run: |
          python3 - << 'PYEOF'
          import glob, re, os
          for p in glob.glob("app/src/main/res/values*/strings.xml"):
              with open(p, "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r'<string name="([^"]+)"(\s+formatted="false")?>', r'<string name="\1" formatted="false">', s)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)
          bg_path = "app/build.gradle.kts"
          if os.path.exists(bg_path):
              with open(bg_path, "r", encoding="utf-8") as f:
                  bg = f.read()
              if "checkReleaseBuilds = false" not in bg:
                  bg = bg.replace(
                      "buildFeatures {",
                      "lint { checkReleaseBuilds = false; abortOnError = false }\n    buildFeatures {"
                  )
              with open(bg_path, "w", encoding="utf-8") as f:
                  f.write(bg)
          print("Sanitized strings.xml and build.gradle.kts for AAPT2!")
          PYEOF

      - name: 4. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 7. Prepare Production Signing Keystore (PKCS12 / 2048-bit RSA)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          FINAL_ALIAS="${KEY_ALIAS:-ethioculturalsports}"
          FINAL_KEY_PASS="${KEY_PASSWORD:-ethioculturalsports}"
          FINAL_STORE_PASS="${STORE_PASSWORD:-ethioculturalsports}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            rm -f release.keystore
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias "$FINAL_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$FINAL_STORE_PASS" \
              -keypass "$FINAL_KEY_PASS" \
              -dname "CN=Ethiopian Cultural Sports Federation, OU=Cultural Sports, O=ECSF, L=Addis Ababa, ST=Addis Ababa, C=ET"
          fi

          cat <<EOF > local.properties
          KEYSTORE_FILE=release.keystore
          KEY_ALIAS=$FINAL_ALIAS
          KEY_PASSWORD=$FINAL_KEY_PASS
          STORE_PASSWORD=$FINAL_STORE_PASS
          EOF

      - name: 8. Build Signed Release Android App Bundle (.aab) & APK (.apk)
        run: gradle :app:bundleRelease :app:assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: 9. Collect Signed Release Outputs
        run: |
          mkdir -p release_outputs
          cp app/build/outputs/bundle/release/*.aab release_outputs/Shah-v1.0.0-PlayStore-Release.aab
          cp app/build/outputs/apk/release/*.apk release_outputs/Shah-v1.0.0-Phone-Install.apk
          ls -lh release_outputs/

      - name: 10. Upload Signed .aab Artifact (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: 1-Shah-GooglePlay-Release-AAB
          path: release_outputs/Shah-v1.0.0-PlayStore-Release.aab
          retention-days: 90

      - name: 11. Upload Signed .apk Artifact (For Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: 2-Shah-Phone-Install-Release-APK
          path: release_outputs/Shah-v1.0.0-Phone-Install.apk
          retention-days: 90

      - name: 12. Upload Keystore Backup & Play Store Graphics
        uses: actions/upload-artifact@v4
        with:
          name: 3-Shah-Keystore-And-PlayStore-Assets
          path: |
            release.keystore
            playstore_assets/*
          retention-days: 90

      - name: 13. Publish Signed .aab & .apk to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "ሻህ (Shah Cultural Sport Game) v1.0.0 — Build #${{ github.run_number }}"
          body: |
            ### 🏆 የሻህ ባህላዊ ስፖርት ጨዋታ (100% Native Kotlin Release)
            - **Google Play Console Bundle (`.aab`)**: `Shah-v1.0.0-PlayStore-Release.aab`
            - **Direct Phone Installer (`.apk`)**: `Shah-v1.0.0-Phone-Install.apk`
            - **Package ID**: `eth.culturalsports.shah` (Version 1.0.0 / Code 1)
          files: |
            release_outputs/Shah-v1.0.0-PlayStore-Release.aab
            release_outputs/Shah-v1.0.0-Phone-Install.apk
          draft: false
          prerelease: false
